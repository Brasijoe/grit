<style>
/* Layout: a birthday card opening onto six ticket stubs, one per month; each stub opens its own event page. */
:root {
  --bg: #f7eef0;
  --paper: #fffafb;
  --ink: #2b1420;
  --muted: #7b5d6a;
  --berry: #9b1f52;
  --gold: #b9832a;
  --line: #e7d2d9;
  --display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1016; --paper: #27161f; --ink: #f6e9ee; --muted: #c2a3b1;
    --berry: #f07aa8; --gold: #e2b25f; --line: #3d2632; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1016; --paper: #27161f; --ink: #f6e9ee; --muted: #c2a3b1;
  --berry: #f07aa8; --gold: #e2b25f; --line: #3d2632; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0;
  background: var(--bg); color: var(--ink); font-family: var(--body);
  font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 960px; margin: 0 auto; padding-block: 56px 72px; }
a { color: inherit; }
a:focus-visible { outline: 2px solid var(--berry); outline-offset: 3px; border-radius: 6px; }

/* Landing */
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(3.2rem, 11vw, 7rem); line-height: .95; margin: 12px 0 20px; text-wrap: balance; }
h1 em { color: var(--berry); }
.lead { max-width: 58ch; font-size: 1.1rem; color: var(--muted); margin: 0; }
.lead strong { color: var(--ink); font-weight: 700; }
.months { list-style: none; padding: 0; margin: 48px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
.months li { display: grid; }
.ticket {
  display: grid; grid-template-columns: 76px 1fr; text-decoration: none;
  background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  transition: transform .2s ease, border-color .2s ease;
}
.ticket:hover { transform: translateY(-3px); border-color: var(--berry); }
.stub {
  display: grid; place-items: center; align-content: center; gap: 2px;
  border-right: 2px dashed var(--line); padding: 16px 0; color: var(--berry);
}
.stub .n { font-family: var(--display); font-size: 2.6rem; line-height: 1; }
.stub .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tbody { padding: 16px 18px; display: grid; gap: 6px; min-width: 0; align-content: start; }
.tdate { font-family: var(--display); font-size: 1.55rem; line-height: 1.1; }
.tpeople { font-size: .92rem; color: var(--muted); }
.status { justify-self: start; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.status.open { border-color: var(--berry); color: var(--berry); }
.sign { margin-top: 56px; font-family: var(--display); font-style: italic; font-size: 1.5rem; color: var(--muted); }

/* Event page */
.back { font-family: var(--mono); font-size: 13px; text-decoration: none; color: var(--muted); }
.back:hover { color: var(--berry); }
.event { margin-top: 32px; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.event-head { padding: 36px clamp(20px, 5vw, 48px); border-bottom: 2px dashed var(--line); }
.event-head h2 { font-family: var(--display); font-weight: 400; font-size: clamp(2.6rem, 8vw, 4.6rem); line-height: 1; margin: 10px 0 0; text-wrap: balance; }
.event-head .weekday { font-family: var(--display); font-style: italic; color: var(--berry); font-size: 1.4rem; margin-top: 8px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0; }
.fact { padding: 24px clamp(20px, 5vw, 48px); border-bottom: 1px solid var(--line); min-width: 0; }
.fact .k { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.fact .v { font-size: 1.15rem; font-weight: 500; margin-top: 4px; }
.group { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 4px; }
.group i { display: block; height: var(--h, 64px); background: var(--ink); -webkit-mask: var(--m) center bottom / contain no-repeat; mask: var(--m) center bottom / contain no-repeat; }

<body>

<main class="wrap" id="app"></main>

<script>
/* =====================================================================
   HIER ANPASSEN — die sechs Events.
   date:    Startdatum JJJJ-MM-TT (optional mit Uhrzeit "2026-12-18T19:00")
   tbd:     true = Tag steht noch nicht fest, angezeigt wird "?. Monat Jahr"
   dauer:   Symbole in Reihenfolge: "sonne" (Tag), "mond" (Nacht)
   group:   Wer dabei ist, in Reihenfolge: "mann", "frau", "junge", "maedchen"
   teaser:  Kurzer Text, erscheint automatisch 7 Tage vorher.
            Achtung: steht ab dem Eintragen im Quelltext.
   secret:  Die verschlüsselten Details (mit tools/encrypt.mjs erzeugt).
            Nur mit dem Schlüssel aus dem QR-Code der Karte lesbar,
            und erst ab 1 Tag vor dem Event.
   ===================================================================== */
const EVENTS = [
  { date: "2026-12-18",            dauer: ["sonne"],                 group: ["frau", "frau"],                                      teaser: "", secret: "" },
  { date: "2027-01-30",            dauer: ["sonne", "mond", "sonne"], group: ["mann", "junge", "frau", "frau", "junge", "mann"],   teaser: "", secret: "" },
  { date: "2027-02-20",            dauer: ["sonne", "mond", "sonne"], group: ["mann", "junge", "frau"],                            teaser: "", secret: "" },
  { date: "2027-03-01", tbd: true, dauer: [],                         group: ["frau", "frau"],                                      teaser: "", secret: "" },
  { date: "2027-04-14",            dauer: ["mond", "sonne", "mond"],  group: ["mann", "junge", "frau", "frau", "maedchen", "mann"], teaser: "", secret: "" },
  { date: "2027-05-07",            dauer: ["mond", "sonne", "mond"],  group: ["mann", "junge", "frau"],                            teaser: "", secret: "" },
];
const TEASER_DAYS_BEFORE = 7;
const UNLOCK_DAYS_BEFORE = 1;
/* ===================================================================== */

const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const DAYS = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const app = document.getElementById("app");

function parseDate(s) {
  const [d, t] = s.split("T");
  const [y, m, day] = d.split("-").map(Number);
  const [hh, mm] = (t || "00:00").split(":").map(Number);
  return new Date(y, m - 1, day, hh || 0, mm || 0);
}
function daysBefore(ev, n) { const d = parseDate(ev.date.split("T")[0]); d.setDate(d.getDate() - n); return d; }
function unlockAt(ev) { return daysBefore(ev, UNLOCK_DAYS_BEFORE); }
function dateReached(ev) { return !ev.tbd && new Date() >= unlockAt(ev); }
function teaserVisible(ev) { return !!ev.teaser && !ev.tbd && new Date() >= daysBefore(ev, TEASER_DAYS_BEFORE); }
function fmt(d) { return d.getDate() + ". " + MONTHS[d.getMonth()] + " " + d.getFullYear(); }
function fmtDate(ev) { const a = parseDate(ev.date); return ev.tbd ? "?. " + MONTHS[a.getMonth()] + " " + a.getFullYear() : fmt(a); }
function weekday(ev) { return ev.tbd ? "" : DAYS[parseDate(ev.date).getDay()]; }
function time(ev) { return ev.date.includes("T") ? ev.date.split("T")[1].slice(0,5) + " Uhr" : null; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
const LABEL = { mann: "Mann", frau: "Frau", junge: "Junge", maedchen: "Mädchen" };
const DLABEL = { sonne: "Tag", mond: "Nacht" };
function dauer(ev) { const d = ev.dauer || []; return d.length ? `<div class="dauer" role="img" aria-label="Dauer: ${d.map(x => DLABEL[x] || x).join(", ")}">${d.map(x => `<i class="${esc(x)}"></i>`).join("")}</div>` : ""; }
function group(ev) { return `<div class="group" role="img" aria-label="${ev.group.map(g => LABEL[g] || g).join(", ")}">${ev.group.map(g => `<i class="${esc(g)}"></i>`).join("")}</div>`; }

function countdown(ev) {
  if (ev.tbd) return "";
  const ms = unlockAt(ev) - new Date();
  if (ms <= 0) return "";
  const days = Math.floor(ms / 864e5), hrs = Math.floor(ms / 36e5) % 24;
  if (days === 0) return "Freigabe in " + hrs + (hrs === 1 ? " Stunde" : " Stunden");
  return "Freigabe in " + days + (days === 1 ? " Tag" : " Tagen") + (days < 7 ? ", " + hrs + " Std." : "");
}

/* Entschlüsselung: AES-GCM, Schlüssel kommt nur aus dem QR-Code (#monat-N~SCHLÜSSEL). */
function b64u(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function decrypt(secret, key) {
  const raw = b64u(secret), iv = raw.slice(0, 12), data = raw.slice(12);
  const k = await crypto.subtle.importKey("raw", b64u(key), "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, k, data);
  return JSON.parse(new TextDecoder().decode(plain));
}

function renderHome() {
  document.title = "Grits sechs Monate";
  app.innerHTML = `
    <div class="eyebrow">Zum Geburtstag</div>
    <h1>Alles Liebe,<br><em>Grit</em></h1>
    <p class="lead">Mein Geschenk an dich sind <strong>sechs Monate</strong> mit <strong>einem Erlebnis pro Monat</strong>.
    Wann es losgeht und wer dabei ist, siehst du schon jetzt. Alles andere wird dir hier je einen Tag vorher verraten.</p>
    <ol class="months">
      ${EVENTS.map((ev, i) => {
        const ready = dateReached(ev) && ev.secret, tease = teaserVisible(ev);
        const label = ready ? "QR-Code scannen" : tease ? "Teaser da" : "Noch geheim";
        return `<li><a class="ticket" href="#monat-${i + 1}">
          <div class="stub"><span class="lbl">Monat</span><span class="n">${i + 1}</span></div>
          <div class="tbody">
            <div class="tdate">${fmtDate(ev)}</div>
            <div class="tmeta">${group(ev)}${dauer(ev)}</div>
            ${tease ? `<div class="tteaser">${esc(ev.teaser)}</div>` : ""}
            <span class="status ${ready || tease ? "open" : ""}">${label}</span>
          </div></a></li>`;
      }).join("")}
    </ol>
    <p class="sign">In Liebe, Johannes</p>`;
}

const LOCK_ICON = `<div class="seal" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>`;
function lockBox(hint) {
  return `<div class="lock">${LOCK_ICON}
    <p class="msg">Informationen zum Event werden erst 1 Tag vor dem Eventdatum freigegeben.</p>
    ${hint ? `<p class="hint">${hint}</p>` : ""}
    <div class="count">${countdown(EVENTS[current.i])}</div></div>`;
}

let current = { i: -1, key: null, token: 0 };

async function detailsBox(ev, key, token) {
  const slot = document.getElementById("slot");
  if (!dateReached(ev)) {
    slot.innerHTML = lockBox(key ? "Deine Karte ist erkannt. Scanne den QR-Code am " + fmt(unlockAt(ev)) + " noch einmal." : "");
    return;
  }
  if (!key) { slot.innerHTML = lockBox("Scanne jetzt den QR-Code auf deiner Karte, um die Details zu sehen."); return; }
  if (!ev.secret) { slot.innerHTML = lockBox("Die Details sind gleich da. Schau in Kürze noch einmal vorbei."); return; }
  try {
    const d = await decrypt(ev.secret, key);
    if (token !== current.token) return;
    slot.innerHTML = `<div class="details">${d.title ? `<h3>${esc(d.title)}</h3>` : ""}<div class="body">${esc(d.text || "")}</div></div>`;
  } catch (e) {
    slot.innerHTML = lockBox("Dieser QR-Code passt nicht zu diesem Event.");
  }
}

function renderEvent(i, key) {
  const ev = EVENTS[i];
  if (!ev) { app.innerHTML = `<a class="back" href="#">← Alle sechs Monate</a><p class="notfound">Dieses Event gibt es nicht.</p>`; return; }
  const t = time(ev), token = ++current.token;
  current.i = i; current.key = key;
  document.title = "Monat " + (i + 1) + " · Grits sechs Monate";
  app.innerHTML = `
    <a class="back" href="#">← Alle sechs Monate</a>
    <article class="event">
      <header class="event-head">
        <div class="eyebrow">Monat ${i + 1} von ${EVENTS.length}</div>
        <h2>${fmtDate(ev)}</h2>
        <div class="weekday">${weekday(ev)}${t ? ", " + t : ""}</div>
      </header>
      <div class="facts">
        <div class="fact"><div class="k">Wer ist dabei</div>${group(ev)}</div>
        ${(ev.dauer || []).length ? `<div class="fact"><div class="k">Dauer</div>${dauer(ev)}</div>` : ""}
      </div>
      ${teaserVisible(ev) ? `<div class="teaser"><div class="k eyebrow">Teaser</div><p>${esc(ev.teaser)}</p></div>` : ""}
      <div id="slot"></div>
    </article>`;
  detailsBox(ev, key, token);
}

function parseHash() {
  const m = location.hash.match(/^#monat-(\d+)(?:~([A-Za-z0-9_-]+))?$/);
  return m ? { i: Number(m[1]) - 1, key: m[2] || null } : null;
}
function route() {
  const h = parseHash();
  if (h) renderEvent(h.i, h.key); else renderHome();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
setInterval(() => { const h = parseHash(); if (h) renderEvent(h.i, h.key); else renderHome(); }, 60000);
