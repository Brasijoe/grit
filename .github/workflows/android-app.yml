name: Android-App bauen

on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/android-app.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: APKs bauen
        working-directory: android
        env:
          GRIT_APP_KEY: ${{ secrets.GRIT_APP_KEY }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Schlüssel vorhanden?
        env:
          GRIT_APP_KEY: ${{ secrets.GRIT_APP_KEY }}
        run: |
          if [ -z "$GRIT_APP_KEY" ]; then
            echo "::error::Das Secret GRIT_APP_KEY fehlt. Die App wurde gebaut, aber ohne Schlüssel nicht hochgeladen."
            exit 1
          fi
      - name: APKs einsammeln
        run: |
          mkdir out
          cp android/app/build/outputs/apk/grit/release/app-grit-release.apk out/6-Monate.apk
          cp android/app/build/outputs/apk/probe/release/app-probe-release.apk out/6-Monate-Test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apps
          path: out/
          retention-days: 3
